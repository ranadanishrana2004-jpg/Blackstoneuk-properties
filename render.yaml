# Render Blueprint: a single web service. The PostgreSQL database lives on Neon (free tier),
# so this site shares nothing with any other Render service.
# Values marked `sync: false` are typed into the Render dashboard and never stored in git.
services:
  - type: web
    name: bsuk-properties
    runtime: node
    plan: starter # always-on; the free plan sleeps after 15 minutes
    region: frankfurt # closest Render region to the UK
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DATABASE_URL # Neon connection string (secret)
        sync: false
      - key: SITE_URL
        value: https://bsuk-properties.onrender.com # change to https://www.bsukproperties.com once the domain is connected
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: CONTACT_EMAIL
        value: info@bsukproperties.com
      - key: MAIL_FROM
        value: info@bsukproperties.com
      - key: NOTIFY_EMAIL
        value: info@bsukproperties.com
      - key: CONTACT_PHONE
        value: "+44 800 043 7867"
      - key: BREVO_API_KEY # added later, once the Brevo key exists (secret)
        sync: false
