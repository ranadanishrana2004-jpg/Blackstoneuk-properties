# Render Blueprint: one web service plus a managed PostgreSQL database.
# Secrets marked `sync: false` are asked for in the Render dashboard and never stored in git.
services:
  - type: web
    name: bsuk-properties
    runtime: node
    plan: starter
    region: frankfurt # closest Render region to the UK
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DATABASE_URL
        fromDatabase:
          name: bsuk-db
          property: connectionString
      - key: SITE_URL
        value: https://www.example.co.uk # change to the live domain
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: CONTACT_EMAIL
        sync: false
      - key: CONTACT_PHONE
        sync: false
      - key: NOTIFY_EMAIL
        sync: false

databases:
  - name: bsuk-db
    plan: basic-256mb
    region: frankfurt
    postgresMajorVersion: "16"
