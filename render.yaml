# Render Blueprint: one web service plus its own PostgreSQL database, both private to this site.
# Nothing here is shared with any other Render service.
# Values marked `sync: false` are typed into the Render dashboard and never stored in git.
services:
  - type: web
    name: bsuk-properties
    runtime: node
    plan: starter # always-on; the free plan sleeps after 15 minutes
    region: frankfurt # closest Render region to the UK
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    autoDeploy: true
    domains:
      - bsukproperties.com
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DATABASE_URL # internal connection string of bsuk-db, injected by Render
        fromDatabase:
          name: bsuk-db
          property: connectionString
      - key: SITE_URL
        value: https://www.bsukproperties.com
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: CONTACT_EMAIL
        value: info@bsukproperties.com
      - key: MAIL_FROM
        value: info@bsukproperties.com
      - key: NOTIFY_EMAIL
        value: info@bsukproperties.com
      - key: CONTACT_PHONE
        value: '+44 800 043 7867'
      - key: BREVO_API_KEY # secret
        sync: false

databases:
  - name: bsuk-db
    plan: basic-256mb
    region: frankfurt # same region as the web service so they talk over Render's private network
    postgresMajorVersion: '16'
